apiVersion: v1
kind: Namespace
metadata:
  name: ingress-ns
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-deploy
  namespace: ingress-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
      - name: nginx
        image: nginx:1.25
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: webapp-svc
  namespace: ingress-ns
spec:
  selector:
    app: webapp
  ports:
  - name: http
    port: 80
    targetPort: 80
